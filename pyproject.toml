[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "one-cedric"
# Single source of truth: one_cedric/__init__.py::__version__
dynamic = ["version"]
description = "One Cedric —— An AI agent for beginners（由 Aoan2011 主持开发，CLI + WebUI）"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0"
authors = [{ name = "Aoan2011" }]
keywords = ["cli", "ai", "ollama", "agent", "webui", "assistant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Aoan2011/One-Cedric"
Repository = "https://github.com/Aoan2011/One-Cedric"

dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "readchar>=4.0",
    "alive-progress>=3.1",
]

[project.optional-dependencies]
yaml      = ["pyyaml>=6.0"]
pdf       = ["pypdf>=4.0"]
schema    = ["jsonschema>=4.0"]
metrics   = ["psutil>=5.9"]
search    = ["beautifulsoup4>=4.12", "lxml>=5.0"]
extract   = ["trafilatura>=1.8", "readability-lxml>=0.8.1"]
db        = ["psycopg2-binary>=2.9", "PyMySQL>=1.1", "pymongo>=4.6"]
archive   = ["py7zr>=0.20", "rarfile>=4.1", "zstandard>=0.22", "lz4>=4.3", "brotli>=1.1"]
barcode   = ["pyzbar>=0.1.9"]
nlp       = ["jieba>=0.42", "OpenCC>=1.1"]
math      = ["sympy>=1.12"]
ocr       = ["pytesseract>=0.3.13", "Pillow>=10.0"]
data      = ["numpy>=1.26", "pandas>=2.0", "matplotlib>=3.8"]
dev       = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "black>=24.0",
             "mypy>=1.11", "types-requests", "types-PyYAML",
             "build>=1.2", "twine>=5.0"]
computer  = ["pyautogui>=0.9.54", "Pillow>=10.0",
             "pygetwindow>=0.0.9", "pyperclip>=1.8"]
computer-full = ["pyautogui>=0.9.54", "Pillow>=10.0",
                 "pygetwindow>=0.0.9", "pyperclip>=1.8", "mss>=9.0"]
office = [
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "msoffcrypto-tool>=5.0",
]
office-ocr = [
    "pdf2image>=1.17",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
office-win = ["pywin32>=306"]
sysops = [
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.2.0; sys_platform == 'win32'",
]
gateway = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
all = [
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "jsonschema>=4.0",
    "psutil>=5.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=1.8",
    "readability-lxml>=0.8.1",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "msoffcrypto-tool>=5.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "Pillow>=10.0",
    "qrcode>=7.4",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "opencv-contrib-python>=4.8",
    "cryptography>=42.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "pygetwindow>=0.0.9",
    "pytesseract>=0.3.10",
    "psycopg2-binary>=2.9",
    "PyMySQL>=1.1",
    "pymongo>=4.6",
    "py7zr>=0.20",
    "rarfile>=4.1",
    "zstandard>=0.22",
    "lz4>=4.3",
    "brotli>=1.1",
    "jieba>=0.42",
    "OpenCC>=1.1",
    "sympy>=1.12",
]

[project.scripts]
one-cedric = "one_cedric:main"

# ---------------------------------------------------------------------------
# Packaging metadata
# ---------------------------------------------------------------------------
[tool.setuptools.dynamic]
version = { attr = "one_cedric._version.__version__" }

[tool.setuptools]
packages = [
    "one_cedric",
    "one_cedric.tools",
    "one_cedric.tools.office",
    "one_cedric.tools.sysops",
    "one_cedric.lsp",
    "one_cedric.computer",
    "one_cedric.gateway",
    "one_cedric.gateway.webui",
    "one_cedric.ui",
    "one_cedric.ui.screens",
]

[tool.setuptools.package-data]
"one_cedric.gateway.webui" = [
    "*.html", "*.js", "*.css", "*.ico",
    "codex/*", "core/*", "design/*",
    "vendor/katex/*", "vendor/katex/fonts/*",
]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*",
]
markers = [
    "smoke: fast, dependency-free import and wiring checks",
    "tools: exercises the tool registry, schemas and dispatcher",
    "e2e: really invokes local tools against temporary files (slower)",
    "slow: tests that take more than a couple of seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".pylibs",
    "_jsdom_test",
    "build",
    "dist",
    "promo",
    "one_cedric/gateway/webui",
]

[tool.ruff.lint]
# 存量代码早于任何 lint 工具；阻断集只保留"能抓到真 bug"的规则
# (pycodestyle 错误 + pyflakes)。风格类规则放在咨询步骤里，见 CI。
select = ["E4", "E7", "E9", "F", "W"]
ignore = [
    "E501",   # 行长由 formatter 负责，不作为 lint 错误
    "E701",   # 单行多语句（存量 27 处，改动面大于收益）
    "E741",   # 变量名 l/I/O（存量 25 处，同上）
    "E402",   # 模块级 import 不在文件顶部：run.py / 可选依赖探测需要
]

[tool.ruff.lint.per-file-ignores]
# 这些 import 只为探测可选依赖是否存在，名称本身不用是有意的。
"one_cedric/gateway/server.py" = ["F401"]
"one_cedric/tools/amap.py" = ["F401"]
"one_cedric/tools/office/common.py" = ["F401"]
"one_cedric/tools/office/word.py" = ["F401"]
"one_cedric/tools/schema.py" = ["E501"]
"tests/*" = ["B011"]

# 咨询用规则集（CI 里 continue-on-error，不阻断）
[tool.ruff.lint.isort]
known-first-party = ["one_cedric"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(\.pylibs|_jsdom_test|build|dist|promo|webui)/
'''

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_untyped_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
exclude = '''(\.pylibs|_jsdom_test|build|dist|promo)/'''

[tool.coverage.run]
source = ["one_cedric"]
omit = ["one_cedric/gateway/webui/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
