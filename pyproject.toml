[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "one-cedric"
version = "0.17.0"
description = "Claude Code 风格的本地文件助手（Ollama / DeepSeek / OpenAI 兼容）"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "you" }]
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "readchar>=4.0",
    "alive-progress>=3.1",
]

[project.optional-dependencies]
yaml      = ["pyyaml>=6.0"]
pdf       = ["pypdf>=4.0"]
schema    = ["jsonschema>=4.0"]
metrics   = ["psutil>=5.9"]
search    = ["beautifulsoup4>=4.12", "lxml>=5.0"]
extract   = ["trafilatura>=1.8", "readability-lxml>=0.8.1"]
computer  = ["pyautogui>=0.9.54", "Pillow>=10.0",
             "pygetwindow>=0.0.9", "pyperclip>=1.8"]
computer-full = ["pyautogui>=0.9.54", "Pillow>=10.0",
                 "pygetwindow>=0.0.9", "pyperclip>=1.8", "mss>=9.0"]
office = [
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "msoffcrypto-tool>=5.0",
]
office-ocr = [
    "pdf2image>=1.17",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
office-win = ["pywin32>=306"]
sysops = [
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.2.0; sys_platform == 'win32'",
]
gateway = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
all = [
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "jsonschema>=4.0",
    "psutil>=5.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=1.8",
    "readability-lxml>=0.8.1",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "msoffcrypto-tool>=5.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
one-cedric = "one_cedric:main"

[tool.setuptools]
packages = [
    "one_cedric",
    "one_cedric.tools",
    "one_cedric.tools.office",
    "one_cedric.tools.sysops",
    "one_cedric.lsp",
    "one_cedric.computer",
    "one_cedric.gateway",
    "one_cedric.gateway.webui",
    "one_cedric.ui",
    "one_cedric.ui.screens",
]

[tool.setuptools.package-data]
"one_cedric.gateway.webui" = ["*.html", "*.js", "*.css"]